name: Deploy GitHub

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias
        working-directory: ./feriadominicalhuanca
        run: npm install

      - name: Rutas
        working-directory: ./feriadominicalhuanca
        run: |
          sed -i "s#'/fondo_feria.jpg'#'/GuiaPracticaSemana07/fondo_feria.jpg'#" src/data/puestos.js

      - name: Compilar
        working-directory: ./feriadominicalhuanca
        run: npx vite build --base=/GuiaPracticaSemana07/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './feriadominicalhuanca/dist'

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
